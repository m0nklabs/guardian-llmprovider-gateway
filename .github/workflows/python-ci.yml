name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-ci:
    uses: m0nklabs/github-action-runners/.github/workflows/python-ci.yml@main
    with:
      python-version: "3.12"
      src-dir: app
      test-dir: tests
      lint-path: "app scripts tests"
    secrets: inherit

  # Coverage runs as its own job rather than inside the reusable workflow above:
  # that one hardcodes `pytest <test-dir> -q --tb=short` and takes no extra pytest
  # arguments, so `--cov` cannot be injected through its inputs and it has no
  # upload step. Install the repository's pinned dependencies and surface failures
  # rather than silently testing a partially provisioned runner. Markers are NOT
  # passed here: pyproject `addopts` already carries
  # `-m "not integration and not finetune_v2_live"` and a CLI -m would override it.
  coverage:
    name: Coverage (pytest-cov)
    runs-on: [self-hosted, Linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -r requirements.txt

      - name: Run pytest with coverage
        run: python -m pytest tests -q --tb=short --cov=app --cov-report=term-missing --cov-fail-under=80

