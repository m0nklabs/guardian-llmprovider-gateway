name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-ci:
    uses: m0nklabs/github-action-runners/.github/workflows/python-ci.yml@main
    with:
      python-version: "3.12"
      src-dir: app
      test-dir: tests
      lint-path: "app scripts tests"
    secrets: inherit

  # Coverage runs as its own job rather than inside the reusable workflow above:
  # that one hardcodes `pytest <test-dir> -q --tb=short` and takes no extra pytest
  # arguments, so `--cov` cannot be injected through its inputs and it has no
  # upload step. The install lines below mirror it so both jobs test the same
  # environment. Markers are NOT passed here: pyproject `addopts` already carries
  # `-m "not integration and not finetune_v2_live"` and a CLI -m would override it.
  coverage:
    name: Coverage (pytest + Codecov)
    runs-on: [self-hosted, Linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -f requirements.txt ]; then pip install --no-deps -r requirements.txt 2>/dev/null || echo "skip heavy deps"; fi

      - name: Run pytest with coverage
        run: python -m pytest tests -q --tb=short --cov=app --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
