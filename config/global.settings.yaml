services_to_stop:
- caramba-backend
- agent-forge
benchmark:
  schedule:
    start_hour: 4
    end_hour: 11
    days:
    - mon
    - tue
    - wed
    - thu
    - fri
proxy:
  # TTL-gated cloud-catalog refresh loop (seconds; floor 10). The loop calls
  # ensure_fresh per provider, which is a no-op while each cached catalog is
  # still fresh — zero network traffic on a healthy deployment.
  catalog_refresh_interval_seconds: 60
  port: 11434
  target: http://localhost:11440
  pid_file: guardian.pid
  vram_limit_mb: 27000
  stream_heartbeat_seconds: 15
grammar:
  enabled: true
  cloud_auto_convert_json: false
  cloud_strict_mode: false
  validate_gbnf: false
cloud_retry:
  enabled: false
  max_retries: 10
  max_hold_seconds: 120
  base_backoff_seconds: 2
  max_backoff_seconds: 30
  jitter_factor: 0.3
  respect_retry_after: true
failover_health:
  failure_threshold: 5
  cooldown_seconds: 30
  rate_limit_cooldown_seconds: 60
# Inference queue (restart-only: the queue object is built at startup, so
# changes here take effect after `systemctl restart llama-guardian` and are NOT
# picked up by POST /api/config/reload).
queue:
  max_concurrent: 1
  # Enforced wait budget for one request in the queue, in seconds. When it
  # elapses the queued request is cancelled as `expired` with
  # `cancel_reason: "queue_timeout"`, and the waiting client receives the
  # usual typed cancellation (HTTP 499, `error: "request_cancelled"`).
  # 0 or a negative value disables the timeout and restores the unbounded wait
  # (GET /v1/queue/status then reports `queue_timeout_enforced: false`); an
  # absent key falls back to the built-in default, 1800.
  queue_timeout_seconds: 1800
  history_ttl: 300
services:
  comfyui_url: http://127.0.0.1:8188
# Caretaker-runtime poll windows (F5 follow-up; hot-reloadable via
# POST /api/config/reload).  Values mirror the pre-config runtime defaults:
# adopt_poll_seconds bounds the adoption poll after 2× /ensure timeout (must
# cover the 10-30s cold-load range plus slow large models; safety-clamped to
# 1..600s), rebind_poll_attempts/interval bound the re-bind poll after a hard
# connection refusal (combined budget: the re-bind phase stays within 120 s
# counting each iteration as interval + a full /ensure round-trip, so the
# recovery path can never be silenced by an in-bounds value), and
# client_timeout_seconds is the per-request daemon timeout (clamped
# 0.5..30s — long cold loads are covered by the adoption poll, not by this
# timeout).  Invalid/out-of-range values fall back to the built-in
# defaults/clamps (see app/config_loader.py).  Total request-hotpath
# worst-case with in-bounds maxima: 2×30s probes + 120s re-bind = 180 s.
caretaker:
  adopt_poll_seconds: 120
  rebind_poll_attempts: 15
  rebind_poll_interval_seconds: 1.0
  client_timeout_seconds: 5.0
stt:
  enabled: true
  timeout_seconds: 300
  # Same arithmetic as tts.ensure_timeout_seconds (must cover the caretaker's
  # CARETAKER_STT_START_TIMEOUT + CARETAKER_STT_VRAM_WAIT_SECONDS).
  ensure_timeout_seconds: 420
  # Provider-driven failover order — only providers that declare stt_url
  # participate (mirrors tts.providers; see docs/API_REFERENCE.md).
  providers:
    - 14700k-local
timeouts:
  tiers:
    tier_70b:
      min_size_mb: 40000
      timeout_seconds: 3600
    tier_32b:
      min_size_mb: 20000
      timeout_seconds: 1200
    tier_13b:
      min_size_mb: 10000
      timeout_seconds: 600
    tier_8b:
      min_size_mb: 5000
      timeout_seconds: 360
    tier_small:
      min_size_mb: 0
      timeout_seconds: 600
  default_timeout: 600
scaler:
  enabled: true
  log_decisions: true
  profiles:
    trivial:
      max_chars: 200
      max_messages: 2
      thinking_budget: 256
      max_tokens: 1024
    simple:
      max_chars: 800
      max_messages: 4
      thinking_budget: 1024
      max_tokens: 4096
    moderate:
      max_chars: 4000
      max_messages: 12
      thinking_budget: 4096
      max_tokens: 8192
    complex:
      max_chars: 15000
      max_messages: 30
      thinking_budget: 8192
      max_tokens: 16384
    deep:
      thinking_budget: -1
      max_tokens: 32768
  queue_pressure:
    moderate_threshold: 2
    heavy_threshold: 4
    moderate_thinking_factor: 0.5
    heavy_thinking_factor: 0.25
    moderate_max_tokens_factor: 0.75
    heavy_max_tokens_factor: 0.5
capture:
  # ── Architecture (operator decision 2026-08-26) ─────────────────────────
  # Guardian stores RAW events in the WAL (full request/response content,
  # incl. system prompts/reasoning/tool results).  Redaction is Keanu's job
  # (scripts/keanu_redact.py), consuming the replayable WAL.  The only
  # in-pipeline transform is media extraction: binary images are written to
  # data/capture/media/ and replaced by a reference block in the event.
  enabled: true
  local_capture: true
  cloud_capture: true
  # Log EVERYTHING (operator decision): no cloud allowlist, no per-client
  # opt-in.  Only genuinely unauthenticated requests (no valid key) are
  # never captured — there is no client identity to attribute them to.
  cloud_allowlist_enabled: false
  allowed_cloud_models: []
  cloud_model_prefixes: []
  per_client_opt_in: false
  allowed_client_refs: []
  # ── Keanu-defaults (NOT applied by Guardian anymore) ─────────────────────
  # The field policies below are the defaults scripts/keanu_redact.py uses
  # when turning raw WAL events into a dataset.  Guardian ignores them.
  system_prompts: strip
  reasoning: strip
  tool_definitions: capture
  tool_calls: capture
  tool_results: strip
  images: hash_and_metadata
  unknown_content_blocks: strip
  capture_root: data/capture
  # ── Retention: INFINITE (operator decision 2026-08-26) ───────────────────
  # -1 = keep everything; retention/cleanup is Keanu's consumption concern,
  # not a Guardian timer.  Rotated files are gzip-compressed; the active file
  # is plain JSONL (since the 2026-08-30 capture-feedback change, so tail -f
  # / jq work and readers never hit a truncated gzip member mid-write).
  retention_days: -1
  max_capture_bytes: -1
  max_pending_events: 10000
  max_file_bytes: 268435456
  max_file_age_seconds: 3600
  file_mode: '0640'
  directory_mode: '0750'
  policy_version: 1.1.0

# Degeneration guard (operator feature 2026-09-02): cut off responses that
# fall into a repetition loop — server-side, standard finish_reason "length".
# Thresholds avoid false positives on lists/code/short echoes;
# enabled: false disables the whole feature.
degeneration:
  enabled: true
  min_period: 6
  max_period: 300
  min_repeats: 3
  min_repeat_bytes: 240
  max_window_chars: 4096
  # Human-visible notice injected at the end of the output on cutoff, so a
  # reader of the text sees something went wrong. Empty text / false = off.
  marker_enabled: true
  marker_text: "[guardian: generation cut off - repetition loop detected]"
# Cross-provider failover group (operator decision 2026-09-09: failover
# groups are a global concern — candidates span providers — so they live in
# the global settings, the primary source per FailoverRegistry). Address:
# "failover/free". Order: currently-healthy first, then the usual primary,
# then the workable :free range. The attempts-loop + failover_health tracking
# skips candidates in failure cooldown, so single-model provider capacity
# windows (nemotron lightning 200+null+500, poolside request_failed — capture
# evidence 09-09) no longer strand a caller.
# Remote-ensure window for PASSIVE failover candidates (windows): before
# forwarding, the gateway ensures the model on that host's caretaker (same
# daemon contract as the local one; fixes the silent wrong-model serve when
# the fallback model is not loaded).  A fresh cold load on the Windows host
# can take ~30-60 s, so this must exceed the caretaker client timeout.
# Hot-reloadable; bounded to 30-600 s.
failover:
  remote_ensure_timeout_seconds: 120

failover_groups:
  # F6 cross-host failover (plan §F6): qwen3.5-9b op beide LAN-GPU's.
  # Windows eerst (dedicated GPU, altijd geladen via boot-ensure); de lokale
  # candidate als echte fallback — bij een lokale ensure schakelt de gateway
  # de eigen backend naar qwen3.5-9b (model-switch, disruptief voor de lokaal
  # geladen workload; daarom alleen als fallback).
  qwen35:
    candidates:
      - {provider: 14700k-local, model: windows/qwen3.5-9b}
      - {provider: ai-kvm2-local, model: qwen3.5-9b}

  # Operator request 2026-09-23: Huihui-Qwen3.5-9B-abliterated (Q4_K_M) on both
  # LAN GPU hosts, kvm2 FIRST (explicit operator order — the local ensure model-
  # switch is accepted here, unlike the qwen35 group above). Windows as fallback
  # when kvm2 is busy (own workload loaded / capacity).
  qwen35-abliterated:
    candidates:
      - {provider: ai-kvm2-local, model: Huihui-Qwen3.5-9B-abliterated}
      - {provider: 14700k-local, model: windows/Huihui-Qwen3.5-9B-abliterated}

  free:
    candidates:
      - provider: openrouter
        model: nvidia/nemotron-3-super-120b-a12b:free
      - provider: openrouter
        model: nvidia/nemotron-3.5-lightning:free
      - provider: openrouter
        model: poolside/laguna-s-2.1:free
      - provider: openrouter
        model: poolside/laguna-xs-2.1:free
      - provider: openrouter
        model: google/gemma-4-31b-it:free
      - provider: openrouter
        model: google/gemma-4-26b-a4b-it:free
      - provider: openrouter
        model: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free

# TTS routing (F6 extension): OpenAI-compatible /v1/audio/speech → the
# qwen3tts-http engine on the Windows host (always-on NSSM service, keyless,
# LAN-firewall-covered). Read at request time — hot-reloadable.
tts:
  enabled: true
  timeout_seconds: 120
  # The caretaker blocks on cold start (model load) and can wait for VRAM to
  # free up; this must stay above CARETAKER_TTS_START_TIMEOUT +
  # CARETAKER_TTS_VRAM_WAIT_SECONDS of the slowest configured host
  # (ai-kvm2: 240 + 120 = 360).
  ensure_timeout_seconds: 420
  default_instruct: ""
  # Provider-driven speech routing (NO cloud/local distinction — the caretaker
  # is a provider and behaves identically on a LAN box or a cloud GPU host).
  # Each provider declares tts_url + management_url + management_key in its own
  # file; the order below is the failover order (first = primary).
  providers:
    - 14700k-local
    - ai-kvm2-local

# Privilege scopes (G1-01, docs/decisions/G1-01-privilege-scopes.md).
# Keys declare their scopes in config/guardian.keys.yaml:
#     metadata:
#       scopes: [client]                      # ordinary inference only
#       scopes: [operator]                    # + /admin/load, /admin/unload
#       scopes: [admin]                       # + /api/keys, /api/config/reload,
#                                             #   shared state, capture export
#       scopes: [capture-export]              # capture WAL export/rotation only
# An absent `scopes` list marks a legacy key: it keeps today's full access to
# privileged routes until `scopes_enforced_after`, and is a plain `client` key
# from that instant on (typed 403 naming the missing scope). Explicitly scoped
# keys are enforced immediately, grace window or not.
# Hot-reloadable via POST /api/config/reload. Shipped default: two weeks after
# the G1-01 decision record. An absent, unparseable or non-ISO value enforces
# immediately (fail-closed) — it never re-opens the window.
auth:
  scopes_enforced_after: "2026-11-11T00:00:00Z"

# Outbound destination policy (G1-02, docs/decisions/G1-02-
# destination-and-credentials.md).  EVERY outbound request Guardian makes —
# provider traffic, catalogs, management/speech hops, redirects — is validated
# against this allowlist before a socket is opened, and the resolved address is
# re-checked and pinned at connect time (DNS rebinding).  A host is reachable
# only through an explicit entry here: loopback, link-local and RFC1918 targets
# are NOT implicitly trusted, cloud metadata addresses (169.254.169.254 &c.)
# are never approvable, and a URL with userinfo or a non-http(s) scheme is
# refused.
#
# HOST ENTRY FIELDS
#   host:    bare hostname or IP literal (no scheme, no port, no path)
#   ports:   the only ports reachable on that host
#   addresses:  optional pinned IP set.  When set, the resolver must stay inside
#               it (use it for an internal hostname); when absent, a hostname
#               may only resolve to PUBLIC addresses, so a public provider name
#               cannot be re-pointed into the LAN.
#   cleartext_credentials: true marks a hop that carries a Bearer key over
#               plain http on the LAN (B-03/B-04).  It does not weaken any
#               check; it keeps the unmigrated hop visible in the startup log.
#
# FAIL-CLOSED: an absent, non-mapping or empty `destination_policy` denies every
# outbound destination with the typed error `destination_denied`
# (reason `policy_unavailable`).  A malformed entry is dropped (loudly) and only
# its host stays unreachable.  Add a host here before configuring a provider,
# catalog or management URL that needs it; hot-reloadable via
# POST /api/config/reload.
destination_policy:
  schemes: [http, https]
  allow:
    # ── This host (loopback): local llama-server, caretakers, speech engines,
    #    the Copilot bridge and ComfyUI.  Cleartext stays on the loopback
    #    interface, so these hops are not a LAN credential exposure.
    - host: 127.0.0.1
      ports: [4000, 4141, 8188, 11440, 11441, 11450]
      note: local llama-server, caretaker, TTS, Copilot bridge, ComfyUI
    # `proxy.target` is written as http://localhost:11440 in this file. An
    # internal *name* must pin its addresses: an unpinned name may only resolve
    # to public addresses (so a provider name cannot be re-pointed into the LAN).
    - host: localhost
      ports: [11440]
      addresses: [127.0.0.1, "::1"]
      note: proxy.target (local llama-server via the localhost name)
    # ── LAN GPU/speech host (14700k-local, B-03/B-04).  Bearer keys travel over
    #    http:// today; the hops are acknowledged, NOT approved as encrypted.
    #    Migration requires the Windows host to serve TLS — tracked blocker.
    - host: 192.168.1.245
      ports: [11440, 11441, 11450, 11451]
      cleartext_credentials: true
      note: 14700k-local inference/caretaker/TTS/STT — cleartext Bearer (B-03/B-04)
    # ── Cloud providers (https only; TLS verification is not configurable).
    - {host: openrouter.ai, ports: [443]}
    - {host: integrate.api.nvidia.com, ports: [443]}
    - {host: api.groq.com, ports: [443]}
    - {host: api.openai.com, ports: [443]}
    - {host: generativelanguage.googleapis.com, ports: [443]}
    - {host: inference.poolside.ai, ports: [443]}
    - {host: api.fish.audio, ports: [443]}
