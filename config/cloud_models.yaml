# cloud_models.yaml — per-model OVERRIDES on top of the dynamic cloud catalog.
#
# This is NOT a hand-maintained model catalog. The default catalog is fetched
# from each provider's own /v1/models endpoint (see app/proxy/cloud_catalog.py)
# and cached in data/cloud_catalog_cache.json. This file only layers exceptions
# from the defaults: context windows, thinking capability, tool support, …
#
# Keys may be written in three scopes, most-specific-wins:
#   - full address:  "{provider}/{brand}/{model}"   (e.g. openrouter/deepseek/deepseek-v4-flash-0731)
#   - namespaced:    "{brand}/{model}"              (e.g. deepseek/deepseek-v4-flash-0731)
#   - bare upstream: "gpt-4o"
#
# Example entries (commented out — uncomment/adjust for your deployment):
#
# openrouter/deepseek/deepseek-v4-flash-0731:
#   context_window: 1048576        # override reported context size
#
# google/google/gemini-3.5-flash:
#   context_window: 1048576
#   thinking: true
#
# gpt-4o:                          # bare upstream name (direct openai provider)
#   context_window: 131072
