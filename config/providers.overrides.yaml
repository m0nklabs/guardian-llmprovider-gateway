providers:
  openrouter:
    catalog_url: /models/user
  nvidia:
    # NVIDIA's /v1/models lists every model regardless of what the free token
    # can reach (102 total, no free marker). This allowlist restricts discovery
    # + routing to the models NVIDIA treats as free ("Free Endpoint" on
    # build.nvidia.com, filter nimType:nim_type_preview), plus moonshotai/kimi-k3
    # which the API serves even though it is not (yet) marked free on the page.
    # Refreshed by scripts/sync_nvidia_free_models.py.
    catalog_allowlist:
      - deepseek-ai/deepseek-v4-flash-0731
      - google/diffusiongemma-26b-a4b-it
      - google/gemma-4-31b-it
      - meta/llama-3.1-70b-instruct
      - meta/llama-3.1-8b-instruct
      - meta/llama-3.2-11b-vision-instruct
      - meta/llama-3.2-1b-instruct
      - meta/llama-3.2-3b-instruct
      - meta/llama-3.2-90b-vision-instruct
      - meta/llama-3.3-70b-instruct
      - meta/llama-guard-4-12b
      - meta/muse-glimmer-30b
      - minimaxai/minimax-m3
      - mistralai/mistral-nemotron
      - moonshotai/kimi-k3
      - nvidia/ising-calibration-1.5-31b
      - nvidia/llama-3.1-nemotron-nano-8b-v1
      - nvidia/llama-3.1-nemotron-nano-vl-8b-v1
      - nvidia/llama-3.1-nemotron-safety-guard-8b-v3
      - nvidia/llama-3.3-nemotron-super-49b-v1
