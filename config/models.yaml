    ngl: 99
    kv_type: f16
    tensor_split: "0.32,0.68"
    extra_args: "--flash-attn on --parallel 1 --batch-size 256 --ubatch-size 128 --repeat-penalty 1 --repeat-last-n 128 --dry-multiplier 1.0 --dry-base 1.75 --dry-penalty-last-n 256 --temp 1.0 --top-p 0.95 --top-k 64"

  # --- Qwen3.6 35B ---
  # turbo4 KV + no DFlash is the fastest serving config (2026-08-10 benchmark,
  # data/bench-qwen36/results.json): 89.1 vs 80.3 tok/s q4_0; DFlash LOSES ~32%
  # here (~0.21 draft acceptance). DFlash entry kept for future draft re-tests.
  Qwen3.6-35B-A3B-HauhauCS-Aggressive:
    path: /home/flip/models/Qwen3.6-35B-A3B-Uncensored-Aggressive.i1-Q4_K_M.gguf
    total_layers: 40
    benchmark_context_limit: 262144
    context: 262144
    ngl: 99
    kv_type: turbo4
    tensor_split: "0.38,0.62"
    mmproj: /home/flip/models/Qwen3.6-35B-A3B-mmproj-BF16.gguf
    vision_context: 262144
    vision_ngl: 99
    vision_tensor_split: "0.36,0.64"
    extra_args: "--reasoning on --reasoning-format deepseek --reasoning-budget -1 --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 0.0 --repeat-penalty 1.0"
  Qwen3.6-35B-A3B-HauhauCS-Aggressive-Turbo4:
    # Text ctx extended past native 262144 via YaRN 1.5x (rope.freq_base=1e7
    # handles it well). Requires the fork's yarn-ctx patch (server no longer
    # caps slot ctx at n_ctx_train when rope scaling is active). Verified
    # 2026-08-10: 292,959-token needle test passed, 811 tok/s prefill.
    # batch 1024/ubatch 256 keeps the 1.6 GB compute buffer within VRAM at
    # 393216 ctx (default 2048/512 OOMs GPU1 on pipeline-parallel reserve).
    # Vision profile: full 262144 ctx at ngl 99 (all layers on GPU) fits thanks
    # to turbo4 KV, but ONLY with split 0.34,0.66 -- 0.38,0.62 segfaults on the
    # first vision request (GPU0 compute-buffer OOM, 248 MiB short). Measured
    # 99.7 tok/s vision gen vs 9.5 tok/s at the old ngl-40 profile.
    path: /home/flip/models/Qwen3.6-35B-A3B-Uncensored-Aggressive.i1-Q4_K_M.gguf
    total_layers: 40
    benchmark_context_limit: 262144
    context: 393216
    ngl: 99
    kv_type: turbo4
    tensor_split: "0.38,0.62"
    mmproj: /home/flip/models/Qwen3.6-35B-A3B-mmproj-BF16.gguf
    vision_context: 262144
    vision_ngl: 99
    vision_tensor_split: "0.34,0.66"
    extra_args: "--flash-attn on --batch-size 1024 --ubatch-size 256 --rope-scaling yarn --rope-scale 1.5 --yarn-orig-ctx 262144 --reasoning on --reasoning-format deepseek --reasoning-budget -1 --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 0.0 --repeat-penalty 1.0"
  Qwen3.6-35B-A3B-HauhauCS-Aggressive-Q8KV:
    path: /home/flip/models/Qwen3.6-35B-A3B-Uncensored-Aggressive.i1-Q4_K_M.gguf
    total_layers: 40
    benchmark_context_limit: 262144
    context: 262144
    ngl: 99
    kv_type: q8_0
    tensor_split: "0.36,0.64"
    mmproj: /home/flip/models/Qwen3.6-35B-A3B-mmproj-BF16.gguf
    vision_context: 262144
    vision_ngl: 99
    vision_tensor_split: "0.36,0.64"
    extra_args: "--reasoning on --reasoning-format deepseek --reasoning-budget -1 --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 0.0 --repeat-penalty 1.0"
  Qwen3.6-35B-A3B-HauhauCS-Aggressive-DFlash-Turbo4:
    path: /home/flip/models/Qwen3.6-35B-A3B-Uncensored-Aggressive.i1-Q4_K_M.gguf
    total_layers: 40
    benchmark_context_limit: 262144
    context: 262144
    ngl: 99
    kv_type: turbo4
    tensor_split: "0.38,0.62"
    mmproj: /home/flip/models/Qwen3.6-35B-A3B-mmproj-BF16.gguf
    vision_context: 262144
    vision_ngl: 36
    vision_tensor_split: "0.36,0.64"
    draft_model_path: /home/flip/models/Qwen3.6-35B-A3B-DFlash-BF16.gguf
    spec_type: draft-dflash
    spec_draft_n_max: 8
    spec_draft_n_min: 1
    draft_cache_type_k: f16
    draft_cache_type_v: f16
    extra_args: "--flash-attn on --parallel 1 --batch-size 256 --ubatch-size 128 --reasoning on --reasoning-format deepseek --reasoning-budget -1 --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 0.0 --repeat-penalty 1.0"

  # --- poolside Laguna-S-2.1 (118B MoE, 57.6 GB in 3 shards) ---
  # ngl 16: 32/48 layers CPU-offload -> 0.12 tok/s gen; DFlash draft doubles
  # that to 0.24 tok/s (acceptance 0.167 pays off because decode is DDR4-bound).
  # ctx capped at 32768: larger KV does not fit alongside 16 GPU layers + draft.
  # .env sets TURBO_AUTO_ASYMMETRIC=0 for pure turbo4 K (skips K->q8_0 upgrade).
  laguna-s-2.1-ud-iq4_xs-160k-tq4:
    path: /home/flip/models/Laguna-S-2.1-UD-IQ4_XS-00001-of-00003.gguf
    total_layers: 48
    benchmark_context_limit: 262144
    context: 32768
    ngl: 16
    kv_type: turbo4
    tensor_split: "0.42,0.58"
    draft_model_path: /home/flip/models/laguna-s-2.1-DFlash-BF16.gguf
    spec_type: draft-dflash
    spec_draft_n_max: 12
    spec_draft_n_min: 2
    draft_cache_type_k: f16
    draft_cache_type_v: f16

  # --- Granite (IBM Granite-4.1-8B instruct, Unsloth GGUF) ---
  # UD-Q8_K_XL dynamic quant (original HF filename). TurboQuant turbo4 KV
  # probed COMPATIBLE (see worker report) but kv_type stays f16 as safe
  # default; operator may switch to turbo4 to save KV VRAM.
  granite-4.1-8b:
    path: /home/flip/models/granite-4.1-8b-UD-Q8_K_XL.gguf
    total_layers: 40
    benchmark_context_limit: 131072
    context: 131072
    ngl: 99
    kv_type: turbo4
    extra_args: "--jinja"

  # --- Qwen3.8 (IBM-dense 27B VLM, hybrid SSM+attention, qwen35 arch) ---
  # Qwen3.8-27B: brand-new model (built on Qwen3.5 arch). Thinking mode is
  # default-on; disable per-request via /no_think. Native vision-language model
  # (images + videos) — requires the mmproj projector below.
  # Unsloth Qwen3.8-27B thinking-mode samplers: temp 1.0, top_p 0.95, top_k 20,
  # min_p 0.0, presence_penalty 0.0, repetition_penalty 1.0
  qwen3.8-27b:
    path: /home/flip/models/qwen3.8-27b/Qwen3.8-27B-UD-Q4_K_XL.gguf
    total_layers: 65
    benchmark_context_limit: 262144
    context: 262144
    ngl: 99
    kv_type: turbo4
    tensor_split: "0.45,0.55"
    mmproj: /home/flip/models/qwen3.8-27b/mmproj-F16.gguf
    default_enable_thinking: true
    extra_args: "--jinja --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 0.0 --repeat-penalty 1.0"
  # Instruct mode (thinking OFF). Unsloth Qwen3.8-27B instruct-mode samplers:
  # temp 0.7, top_p 0.80, top_k 20, min_p 0.0, presence_penalty 1.5,
  # repetition_penalty 1.0. Same GGUF file, different reasoning flag + samplers.
  qwen3.8-27b-instruct:
    path: /home/flip/models/qwen3.8-27b/Qwen3.8-27B-UD-Q4_K_XL.gguf
    total_layers: 65
    benchmark_context_limit: 262144
    context: 262144
    ngl: 99
    kv_type: turbo4
    tensor_split: "0.45,0.55"
    mmproj: /home/flip/models/qwen3.8-27b/mmproj-F16.gguf
    default_enable_thinking: false
    extra_args: "--jinja --reasoning off --temp 0.7 --top-p 0.8 --top-k 20 --min-p 0.0 --presence-penalty 1.5 --repeat-penalty 1.0"

