    total_layers: 48
    benchmark_context_limit: 131072
    context: 131072
    ngl: 99
    kv_type: turbo4
    cuda_visible_devices: "1"
    mmproj: /home/flip/models/mmproj-gemma-4-12b-it-qat-q4_0.gguf
    extra_args: "--main-gpu 1 -sm none --flash-attn on"
    vision_context: 131072
    vision_ngl: 99
  gemma-4-E4B-it-uncensored:
