# === Guardian Security Config ===
guardian:
  # Pin a model: blocks ALL client-triggered switches (startup/force override).
  pinned_model: null
  # Client names (api_keys.json "name") allowed to trigger model switches.
  # Empty = unrestricted (backward compat).
  switch_allowlist:
  # Auto-unload llama-server after N minutes idle; next request reloads (~30s).
  idle_unload_minutes: 5
