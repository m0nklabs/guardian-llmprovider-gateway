# === Build / runtime pin ===
# llama-server binary: cuda128-laguna-tq-full fork, CUDA 12.8 (GGML_CUDA_FA=ON,
# arch 86;120 for RTX 3060 + RTX 5060 Ti). systemd pins LLAMA_SERVER_BINARY via
# /etc/systemd/system/llama-server.service.d/20-turboquant-backend.conf.
# The fork adds TurboQuant KV types (turbo2/3/4) + DFlash attn_gate support;
# upstream has neither. KV type CLI token is "turbo4" (NOT tq4_0/turbo4_0 —
# those silently fall back to f16). Benchmark rationale: CHANGELOG.md 2026-08-10
# and FORK_BENCHMARK_NOTES.md on the fork (branch cuda128-laguna-tq-full).
# Tuning history for every entry: CHANGELOG.md + docs/HARDWARE_TUNING.md.
models:
  # --- Small / utility ---
  llama3.2-3b:
    path: /home/flip/models/llama3.2-3b.gguf
    total_layers: 28
    benchmark_context_limit: 131072
    context: 131072
    ngl: 99
    kv_type: f16
    grammar_decoding: true   # GCD capability hint (default: true for local, false for cloud)
  nomic-embed-text-v2-moe.f16:
    path: /home/flip/models/nomic-embed-text-v2-moe.f16.gguf
    model_type: embedding
    default_enable_thinking: false
    total_layers: 12
    benchmark_context_limit: 512
    context: 32768
    ngl: 99
    extra_args: "--embedding --reasoning off"
  nomic-embed-text-cpu:
    path: /home/flip/models/nomic-embed-text-cpu.gguf
    model_type: embedding
    default_enable_thinking: false
    total_layers: 12
    benchmark_context_limit: 2048
    context: 32768
    ngl: 99
    extra_args: "--embedding --reasoning off"

  # --- Reasoning / general text ---
  Phi-4-reasoning-plus:
    path: /home/flip/models/Phi-4-reasoning-plus-Q8_0.gguf
    total_layers: 40
    benchmark_context_limit: 32768
    context: 32768
    ngl: 99
    kv_type: f16
    tensor_split: "0.45,0.55"

  # --- Gemma 4 ---
  Huihui-gemma-4-26B-A4B-it-abliterated:
    path: /home/flip/models/gemma-4-26B-A4B.unsloth-imatrix-UD-Q4_K_XL.gguf
    total_layers: 30
    benchmark_context_limit: 262144
    context: 262144
    ngl: 99
    kv_type: turbo4
    tensor_split: "0.45,0.55"
    mmproj: /home/flip/models/gemma-4-26b-a4b-mmproj-BF16.gguf
    extra_args: "--flash-attn on --repeat-penalty 1 --temp 1.0 --top-p 0.95 --top-k 64"
  Huihui-gemma-4-26B-A4B-it-abliterated-Q8KV:
    path: /home/flip/models/gemma-4-26B-A4B.unsloth-imatrix-UD-Q4_K_XL.gguf
    total_layers: 30
    benchmark_context_limit: 262144
    context: 262144
    ngl: 99
    kv_type: turbo4
    tensor_split: "0.36,0.64"
    mmproj: /home/flip/models/gemma-4-26b-a4b-mmproj-BF16.gguf
    extra_args: "--flash-attn on --repeat-penalty 1 --temp 1.0 --top-p 0.95 --top-k 64"
    vision_context: 262144
    vision_ngl: 99
    vision_tensor_split: "0.36,0.64"
  unsloth-gemma-4-26B-A4B-it-qat-UD-Q4_K_XL-Q8KV:
    path: /home/flip/models/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
    total_layers: 30
    benchmark_context_limit: 262144
    context: 262144
    ngl: 99
    kv_type: turbo4
    tensor_split: "0.36,0.64"
    mmproj: /home/flip/models/gemma-4-26b-a4b-mmproj-BF16.gguf
    extra_args: "--flash-attn on --repeat-penalty 1 --temp 1.0 --top-p 0.95 --top-k 64 --main-gpu 1 -sm layer"
    vision_context: 262144
    vision_ngl: 99
    vision_tensor_split: "0.36,0.64"
  gemma-4-E4B-it-uncensored:
    path: /home/flip/models/gemma-4-E4B-it-uncensored-Q4_K_M.gguf
    total_layers: 42
    benchmark_context_limit: 131072
    context: 131072
    ngl: 99
    kv_type: f16
    tensor_split: "0.32,0.68"
    extra_args: "--flash-attn on --parallel 1 --batch-size 256 --ubatch-size 128 --repeat-penalty 1 --repeat-last-n 128 --dry-multiplier 1.0 --dry-base 1.75 --dry-penalty-last-n 256 --temp 1.0 --top-p 0.95 --top-k 64"

  # --- Qwen3.6 35B ---
  # turbo4 KV + no DFlash is the fastest serving config (2026-08-10 benchmark,
  # data/bench-qwen36/results.json): 89.1 vs 80.3 tok/s q4_0; DFlash LOSES ~32%
  # here (~0.21 draft acceptance). DFlash entry kept for future draft re-tests.
  Qwen3.6-35B-A3B-HauhauCS-Aggressive:
    path: /home/flip/models/Qwen3.6-35B-A3B-Uncensored-Aggressive.i1-Q4_K_M.gguf
    total_layers: 40
    benchmark_context_limit: 262144
    context: 262144
    ngl: 99
    kv_type: turbo4
    tensor_split: "0.38,0.62"
    mmproj: /home/flip/models/Qwen3.6-35B-A3B-mmproj-BF16.gguf
    vision_context: 262144
    vision_ngl: 99
    vision_tensor_split: "0.36,0.64"
    extra_args: "--reasoning on --reasoning-format deepseek --reasoning-budget -1 --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 0.0 --repeat-penalty 1.0"
  Qwen3.6-35B-A3B-HauhauCS-Aggressive-Turbo4:
    # Text ctx extended past native 262144 via YaRN 1.5x (rope.freq_base=1e7
    # handles it well). Requires the fork's yarn-ctx patch (server no longer
    # caps slot ctx at n_ctx_train when rope scaling is active). Verified
    # 2026-08-10: 292,959-token needle test passed, 811 tok/s prefill.
    # batch 1024/ubatch 256 keeps the 1.6 GB compute buffer within VRAM at
    # 393216 ctx (default 2048/512 OOMs GPU1 on pipeline-parallel reserve).
    # Vision profile: full 262144 ctx at ngl 99 (all layers on GPU) fits thanks
    # to turbo4 KV, but ONLY with split 0.34,0.66 -- 0.38,0.62 segfaults on the
    # first vision request (GPU0 compute-buffer OOM, 248 MiB short). Measured
    # 99.7 tok/s vision gen vs 9.5 tok/s at the old ngl-40 profile.
    path: /home/flip/models/Qwen3.6-35B-A3B-Uncensored-Aggressive.i1-Q4_K_M.gguf
    total_layers: 40
    benchmark_context_limit: 262144
    context: 393216
    ngl: 99
    kv_type: turbo4
    tensor_split: "0.38,0.62"
    mmproj: /home/flip/models/Qwen3.6-35B-A3B-mmproj-BF16.gguf
    vision_context: 262144
    vision_ngl: 99
    vision_tensor_split: "0.34,0.66"
    extra_args: "--flash-attn on --batch-size 1024 --ubatch-size 256 --rope-scaling yarn --rope-scale 1.5 --yarn-orig-ctx 262144 --reasoning on --reasoning-format deepseek --reasoning-budget -1 --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 0.0 --repeat-penalty 1.0"
  Qwen3.6-35B-A3B-HauhauCS-Aggressive-Q8KV:
    path: /home/flip/models/Qwen3.6-35B-A3B-Uncensored-Aggressive.i1-Q4_K_M.gguf
    total_layers: 40
    benchmark_context_limit: 262144
    context: 262144
    ngl: 99
    kv_type: q8_0
    tensor_split: "0.36,0.64"
    mmproj: /home/flip/models/Qwen3.6-35B-A3B-mmproj-BF16.gguf
    vision_context: 262144
    vision_ngl: 99
    vision_tensor_split: "0.36,0.64"
    extra_args: "--reasoning on --reasoning-format deepseek --reasoning-budget -1 --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 0.0 --repeat-penalty 1.0"
  Qwen3.6-35B-A3B-HauhauCS-Aggressive-DFlash-Turbo4:
    path: /home/flip/models/Qwen3.6-35B-A3B-Uncensored-Aggressive.i1-Q4_K_M.gguf
    total_layers: 40
    benchmark_context_limit: 262144
    context: 262144
    ngl: 99
    kv_type: turbo4
    tensor_split: "0.38,0.62"
    mmproj: /home/flip/models/Qwen3.6-35B-A3B-mmproj-BF16.gguf
    vision_context: 262144
    vision_ngl: 36
    vision_tensor_split: "0.36,0.64"
    draft_model_path: /home/flip/models/Qwen3.6-35B-A3B-DFlash-BF16.gguf
    spec_type: draft-dflash
    spec_draft_n_max: 8
    spec_draft_n_min: 1
    draft_cache_type_k: f16
    draft_cache_type_v: f16
    extra_args: "--flash-attn on --parallel 1 --batch-size 256 --ubatch-size 128 --reasoning on --reasoning-format deepseek --reasoning-budget -1 --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 0.0 --repeat-penalty 1.0"

  # --- Granite (IBM Granite-4.1-8B instruct, Unsloth GGUF) ---
  # UD-Q8_K_XL dynamic quant (original HF filename). TurboQuant turbo4 KV
  # probed COMPATIBLE (see worker report) but kv_type stays f16 as safe
  # default; operator may switch to turbo4 to save KV VRAM.
  granite-4.1-8b:
    path: /home/flip/models/granite-4.1-8b-UD-Q8_K_XL.gguf
    total_layers: 40
    benchmark_context_limit: 131072
    context: 131072
    ngl: 99
    kv_type: turbo4
    extra_args: "--jinja"

  # --- Qwen3.8-27B (Alibaba Qwen, arch: qwen35; Unsloth UD-Q4_K_XL quant) ---
  # Native vision-language model (images + videos) — requires the mmproj
  # projector below. Thinking mode is default-on; disable per-request /no_think.
  # Unsloth Qwen3.8-27B thinking-mode samplers: temp 1.0, top_p 0.95, top_k 20,
  # min_p 0.0, presence_penalty 0.0, repetition_penalty 1.0
  qwen3.8-27b:
    path: /home/flip/models/qwen3.8-27b/Qwen3.8-27B-UD-Q4_K_XL.gguf
    total_layers: 65
    benchmark_context_limit: 262144
    context: 262144
    ngl: 99
    kv_type: turbo4
    tensor_split: "0.45,0.55"
    mmproj: /home/flip/models/qwen3.8-27b/mmproj-F16.gguf
    default_enable_thinking: true
    extra_args: "--jinja --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 0.0 --repeat-penalty 1.0"
  # Q8KV variant: q8_0 KV cache (hoger quality dan turbo4, ~2× VRAM) en
  # tensor_split 0.36,0.64 — alleen geheugen-settings overgenomen van
  # Qwen3.6-...-Q8KV. Alle andere settings (samplers, context, ngl, mmproj,
  # thinking-mode) identiek aan qwen3.8-27b hierboven.
  qwen3.8-27b-q8kv:
    path: /home/flip/models/qwen3.8-27b/Qwen3.8-27B-UD-Q4_K_XL.gguf
    total_layers: 65
    benchmark_context_limit: 262144
    context: 262144
    ngl: 99
    kv_type: q8_0
    tensor_split: "0.36,0.64"
    mmproj: /home/flip/models/qwen3.8-27b/mmproj-F16.gguf
    default_enable_thinking: true
    extra_args: "--jinja --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 0.0 --repeat-penalty 1.0"
  # Instruct mode (thinking OFF). Unsloth Qwen3.8-27B instruct-mode samplers:
  # temp 0.7, top_p 0.80, top_k 20, min_p 0.0, presence_penalty 1.5,
  # repetition_penalty 1.0. Same GGUF file, different reasoning flag + samplers.
  qwen3.8-27b-instruct:
    path: /home/flip/models/qwen3.8-27b/Qwen3.8-27B-UD-Q4_K_XL.gguf
    total_layers: 65
    benchmark_context_limit: 262144
    context: 262144
    ngl: 99
    kv_type: turbo4
    tensor_split: "0.45,0.55"
    mmproj: /home/flip/models/qwen3.8-27b/mmproj-F16.gguf
    default_enable_thinking: false
    extra_args: "--jinja --reasoning off --temp 0.7 --top-p 0.8 --top-k 20 --min-p 0.0 --presence-penalty 1.5 --repeat-penalty 1.0"

  # Qwen3.5-9B (Alibaba Qwen, arch: qwen35; Unsloth UD-Q8_K_XL quant)
  # Native vision-language model (image_count/video_count macros in chat
  # template) — requires the mmproj projector below.
  # kv_type turbo4: ctx=262144 + ngl=99 — f16 KV would be ~34 GB (OOM),
  # turbo4 KV ~8.6 GB fits both GPUs with the 0.45/0.55 split.
  #
  # 4 variants following the official Unsloth recommended sampler sets:
  #   thinking-general  / thinking-coding / instruct-general / instruct-reasoning
  # Same GGUF + mmproj; only default_enable_thinking + extra_args samplers differ.

  # [1] Thinking mode, general tasks: temp 1.0, top_p 0.95, pp 1.5
  qwen3.5-9b:
    path: /home/flip/models/qwen3.5-9b/Qwen3.5-9B-UD-Q8_K_XL.gguf
    total_layers: 32
    benchmark_context_limit: 262144
    context: 262144
    ngl: 99
    kv_type: turbo4
    tensor_split: "0.45,0.55"
    mmproj: /home/flip/models/qwen3.5-9b/mmproj-F16.gguf
    default_enable_thinking: true
    extra_args: "--jinja --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 1.5 --repeat-penalty 1.0"

  # [2] Thinking mode, precise coding (e.g. WebDev): temp 0.6, pp 0.0
  qwen3.5-9b-coder:
    path: /home/flip/models/qwen3.5-9b/Qwen3.5-9B-UD-Q8_K_XL.gguf
    total_layers: 32
    benchmark_context_limit: 262144
    context: 262144
    ngl: 99
    kv_type: turbo4
    tensor_split: "0.45,0.55"
    mmproj: /home/flip/models/qwen3.5-9b/mmproj-F16.gguf
    default_enable_thinking: true
    extra_args: "--jinja --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 0.0 --repeat-penalty 1.0"

  # [3] Instruct (non-thinking) mode, general tasks: temp 0.7, top_p 0.8, pp 1.5
  qwen3.5-9b-instruct:
    path: /home/flip/models/qwen3.5-9b/Qwen3.5-9B-UD-Q8_K_XL.gguf
    total_layers: 32
    benchmark_context_limit: 262144
    context: 262144
    ngl: 99
    kv_type: turbo4
    tensor_split: "0.45,0.55"
    mmproj: /home/flip/models/qwen3.5-9b/mmproj-F16.gguf
    default_enable_thinking: false
    extra_args: "--jinja --reasoning off --temp 0.7 --top-p 0.8 --top-k 20 --min-p 0.0 --presence-penalty 1.5 --repeat-penalty 1.0"

  # [4] Instruct (non-thinking) mode for reasoning tasks: temp 1.0, top_p 0.95, pp 1.5
  qwen3.5-9b-reasoner:
    path: /home/flip/models/qwen3.5-9b/Qwen3.5-9B-UD-Q8_K_XL.gguf
    total_layers: 32
    benchmark_context_limit: 262144
    context: 262144
    ngl: 99
    kv_type: turbo4
    tensor_split: "0.45,0.55"
    mmproj: /home/flip/models/qwen3.5-9b/mmproj-F16.gguf
    default_enable_thinking: false
    extra_args: "--jinja --reasoning off --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 1.5 --repeat-penalty 1.0"

# === Model Aliases ===
# Short names usable in API requests: {"model": "qwen3.6-35b-uncensored"}
aliases:
  qwen3.6-35b: "Qwen3.6-35B-A3B-HauhauCS-Aggressive"
  qwen3.6-35b-uncensored: "Qwen3.6-35B-A3B-HauhauCS-Aggressive-Q8KV"
  qwen3.6-35b-fast: "Qwen3.6-35B-A3B-HauhauCS-Aggressive-Turbo4"
  qwen3.6-35b-turbo4: "Qwen3.6-35B-A3B-HauhauCS-Aggressive-Turbo4"
  qwen3.6-35b-uncensored-fast: "Qwen3.6-35B-A3B-HauhauCS-Aggressive-Turbo4"
  qwen3.6-35b-dflash-turbo4: "Qwen3.6-35B-A3B-HauhauCS-Aggressive-DFlash-Turbo4"
  qwen3.6-35b-q8kv: "Qwen3.6-35B-A3B-HauhauCS-Aggressive-Q8KV"
  qwen3.6-35b-uncensored-q8kv: "Qwen3.6-35B-A3B-HauhauCS-Aggressive-Q8KV"
  phi4: "Phi-4-reasoning-plus"
  gemma4: "Huihui-gemma-4-26B-A4B-it-abliterated-Q8KV"
  gemma4-26b: "Huihui-gemma-4-26B-A4B-it-abliterated-Q8KV"
  gemma4-26b-qat: "unsloth-gemma-4-26B-A4B-it-qat-UD-Q4_K_XL-Q8KV"
  gemma4-26b-qat-q8kv: "unsloth-gemma-4-26B-A4B-it-qat-UD-Q4_K_XL-Q8KV"
  gemma4-e4b: "gemma-4-E4B-it-uncensored"
  llama3: "llama3.2-3b"
  qwen3.8-q8kv: "qwen3.8-27b-q8kv"
  # Qwen3.5-9B sampler variants (short aliases)
  qwen3.5-coder: "qwen3.5-9b-coder"
  qwen3.5-instruct: "qwen3.5-9b-instruct"
  qwen3.5-reasoner: "qwen3.5-9b-reasoner"

# === Guardian Security Config ===
guardian:
  # Pin a model: blocks ALL client-triggered switches (startup/force override).
  pinned_model: null
  # Client names (api_keys.json "name") allowed to trigger model switches.
  # Empty = unrestricted (backward compat).
  switch_allowlist:
  # Auto-unload llama-server after N minutes idle; next request reloads (~30s).
  idle_unload_minutes: 5
