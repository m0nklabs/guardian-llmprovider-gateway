# === Build / runtime pin ===
# llama-server binary: cuda128-laguna-tq-full fork, CUDA 12.8 (GGML_CUDA_FA=ON,
# arch 86;120 for RTX 3060 + RTX 5060 Ti). systemd pins LLAMA_SERVER_BINARY via
# /etc/systemd/system/llama-server.service.d/20-turboquant-backend.conf.
# The fork adds TurboQuant KV types (turbo2/3/4) + DFlash attn_gate support;
# upstream has neither. KV type CLI token is "turbo4" (NOT tq4_0/turbo4_0 —
# those silently fall back to f16). Benchmark rationale: CHANGELOG.md 2026-08-10
# and FORK_BENCHMARK_NOTES.md on the fork (branch cuda128-laguna-tq-full).
# Tuning history for every entry: CHANGELOG.md + docs/HARDWARE_TUNING.md.
models:
  # --- Small / utility ---
  llama3.2-3b:
    path: /home/flip/models/llama3.2-3b.gguf
    total_layers: 28
    benchmark_context_limit: 131072
    context: 131072
    ngl: 99
    kv_type: f16
    grammar_decoding: true   # GCD capability hint (default: true for local, false for cloud)
  nomic-embed-text-v2-moe.f16:
    path: /home/flip/models/nomic-embed-text-v2-moe.f16.gguf
    model_type: embedding
    default_enable_thinking: false
    total_layers: 12
    benchmark_context_limit: 512
    context: 32768
    ngl: 99
    extra_args: "--embedding --reasoning off"
  nomic-embed-text-cpu:
    path: /home/flip/models/nomic-embed-text-cpu.gguf
    model_type: embedding
    default_enable_thinking: false
    total_layers: 12
    benchmark_context_limit: 2048
    context: 32768
    ngl: 99
    extra_args: "--embedding --reasoning off"

  # --- Reasoning / general text ---
  Phi-4-reasoning-plus:
    path: /home/flip/models/Phi-4-reasoning-plus-Q8_0.gguf
    total_layers: 40
    benchmark_context_limit: 32768
    context: 32768
    ngl: 99
    kv_type: f16
    tensor_split: "0.45,0.55"
  Ministral-3-14B-Reasoning-2512:
    path: /home/flip/models/Ministral-3-14B-Reasoning-2512-Q8_0.gguf
    total_layers: 40
    benchmark_context_limit: 262144
    context: 262144
    ngl: 99
    kv_type: turbo4
    tensor_split: "0.45,0.55"
  Qwen3-30B-A3B-Thinking-2507:
    path: /home/flip/models/Qwen3-30B-A3B-Thinking-2507-Q4_K_M.gguf
    total_layers: 48
    benchmark_context_limit: 262144
    context: 262144
    ngl: 99
    kv_type: turbo4
    tensor_split: "0.45,0.55"

  # --- Vision models ---
  Step3-VL-10B:
    path: /home/flip/models/Step3-VL-10B-F16.gguf
    total_layers: 36
    benchmark_context_limit: 262144
    context: 262144
    ngl: 99
    kv_type: turbo4
    tensor_split: "0.45,0.55"
    mmproj: /home/flip/models/mmproj-Step3-VL-10B-F16.gguf
  Ornith-1.0-35B:
    path: /home/flip/models/Ornith-1.0-35B-Q4_K_M.gguf
    total_layers: 40
    benchmark_context_limit: 262144
    context: 262144
    ngl: 99
    kv_type: turbo4
    tensor_split: "0.42,0.58"
    mmproj: /home/flip/models/mmproj-Ornith-1.0-35B-bf16.gguf
    vision_context: 262144
    vision_ngl: 99
    vision_tensor_split: "0.42,0.58"

  # --- Gemma 4 ---
  Huihui-gemma-4-26B-A4B-it-abliterated:
    path: /home/flip/models/gemma-4-26B-A4B.unsloth-imatrix-UD-Q4_K_XL.gguf
    total_layers: 30
    benchmark_context_limit: 262144
    context: 262144
    ngl: 99
    kv_type: turbo4
    tensor_split: "0.45,0.55"
    mmproj: /home/flip/models/gemma-4-26b-a4b-mmproj-BF16.gguf
    extra_args: "--flash-attn on --repeat-penalty 1 --temp 1.0 --top-p 0.95 --top-k 64"
  Huihui-gemma-4-26B-A4B-it-abliterated-Q8KV:
    path: /home/flip/models/gemma-4-26B-A4B.unsloth-imatrix-UD-Q4_K_XL.gguf
