    extra_args: "--flash-attn on --repeat-penalty 1 --temp 1.0 --top-p 0.95 --top-k 64"
    vision_context: 262144
    vision_ngl: 99
    vision_tensor_split: "0.36,0.64"
  unsloth-gemma-4-26B-A4B-it-qat-UD-Q4_K_XL-Q8KV:
