    context: 262144
    ngl: 99
    kv_type: turbo4
    tensor_split: "0.36,0.64"
    mmproj: /home/flip/models/gemma-4-26b-a4b-mmproj-BF16.gguf
    extra_args: "--flash-attn on --repeat-penalty 1 --temp 1.0 --top-p 0.95 --top-k 64 --main-gpu 1 -sm layer"
    vision_context: 262144
    vision_ngl: 99
