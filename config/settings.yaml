services_to_stop:
- caramba-backend
- agent-forge
benchmark:
  schedule:
    start_hour: 4
    end_hour: 11
    days:
    - mon
    - tue
    - wed
    - thu
    - fri
proxy:
  port: 11434
  target: http://localhost:11440
  pid_file: guardian.pid
  vram_limit_mb: 27000
  stream_heartbeat_seconds: 15
# Model discovery always advertises a positive context window. These values
# override upstream catalogs for every equivalent raw, openrouter/, or
# guardian/{provider}/ model ID. Add entries when a provider catalog omits a
# context size or when a verified provider value must take precedence.
context_overrides:
  moonshotai/kimi-k3: 1048576
  gpt-4.1: 1047576
  deepseek/deepseek-chat: 1000000
# Cloud retry policy for upstream 429 (rate-limited) responses.
# DISABLED (2026-08-12): Guardian passes upstream 429 responses straight
# through to the client — the agent harness (Claude Code, goose, …) owns
# 429 backoff/retry. Re-enable only if a client is known not to retry 429s.
# When disabled, the failover 429 probe (60s wait + one retry) is also
# skipped; cross-provider failover switching itself stays active.
cloud_retry:
  enabled: false
  max_retries: 10            # was 30 — 10 is plenty with failover as the real backstop
  max_hold_seconds: 120      # was 600 — 2 min hold, then failover to next candidate
  base_backoff_seconds: 2    # was 1 — start slightly higher to let rate limit clear
  max_backoff_seconds: 30    # was 60 — cap at 30s, failover handles the rest
  jitter_factor: 0.3         # was 0.25 — more jitter to spread concurrent requests
  respect_retry_after: true

# Circuit breaker for failover health tracking. When a provider candidate
# accumulates this many consecutive non-429 failures it is "tripped" and
# skipped for cooldown_seconds. 429s never count (rate limiting ≠ broken).
# NVIDIA (free tier) is the priority source — keep the threshold high so
# transient failures don't trip it, and the cooldown short so it recovers
# quickly and can be tried again before falling through to OpenRouter.
failover_health:
  failure_threshold: 5
  cooldown_seconds: 30
  rate_limit_cooldown_seconds: 60
# === Cloud LLM Providers (LLM Router) ===
# When a requested model matches a provider entry below, Guardian forwards
# the request directly to that cloud API instead of the local llama-server.
# Cloud models bypass the VRAM scheduler, model switch logic, and inference
# queue — the cloud API handles its own rate limiting.
#
# API keys support ${ENV_VAR} expansion so secrets stay out of the repo.
# Leave api_key empty (or unset the env var) to disable a provider at runtime.
providers:
  openrouter:
    enabled: true
    base_url: https://openrouter.ai/api/v1
    api_key: ${OPENROUTER_API_KEY}
    timeout_seconds: 1200   # doubled 2026-08-12: pi owns 429 backoff; long reasoning generations need headroom
    # Any model whose name starts with one of these namespaces is recognised
    # as an OpenRouter cloud model — key-independent, using the global key
    # above — so clients can send raw upstream names not listed in `models:`.
    # z-ai/, minimax/, poolside/, moonshotai/, nvidia/ added for failover
    # fallback models (free + paid) that mirror NVIDIA NIM / Poolside direct.
    model_prefixes:
      - anthropic/
      - openai/
      - google/
      - meta-llama/
      - deepseek/
      - qwen/
      - mistralai/
      - z-ai/
      - minimax/
      - poolside/
      - moonshotai/
      - nvidia/
    models:
      - anthropic/claude-3.5-sonnet
      - openai/gpt-4o
      - openai/gpt-4o-mini
      - google/gemini-2.0-flash-exp
      - meta-llama/llama-3.3-70b-instruct
      - deepseek/deepseek-chat
      - qwen/qwen-2.5-72b-instruct
      - mistralai/mistral-large
      # ── Failover mirror models (also on NVIDIA NIM / Poolside direct) ──
      - z-ai/glm-5.2
      - minimax/minimax-m3
      # ── OpenRouter-exclusive free models (no NVIDIA equivalent) ──
      - poolside/laguna-s-2.1:free
      - poolside/laguna-xs-2.1:free
      - nvidia/nemotron-3-nano-30b-a3b:free
      - nvidia/nemotron-3-super-120b-a12b:free
      - nvidia/nemotron-3-ultra-550b-a55b:free
      # ── Paid high-end models ──
      - moonshotai/kimi-k3
  nvidia:
    enabled: true
    base_url: https://integrate.api.nvidia.com/v1
    api_key: ${NVIDIA_API_KEY}
    timeout_seconds: 1200   # doubled 2026-08-12: pi owns 429 backoff; long reasoning generations need headroom
    # NVIDIA NIM namespaces — recognised key-independently via the global key.
    # z-ai/ added: NVIDIA NIM hosts glm-5.2 (z-ai/glm-5.2) — recognised via
    # prefix so clients can send the raw upstream name without a guardian/ route.
    model_prefixes:
      - nvidia/
      - deepseek-ai/
      - minimaxai/
      - z-ai/
    models:
      - minimaxai/minimax-m3
      - nvidia/llama-3.1-nemotron-70b-instruct
      - nvidia/llama-3.1-nemotron-ultra-253b-v1
      - deepseek-ai/deepseek-v4-pro
      - nvidia/nemotron-3-nano-30b-a3b
      - nvidia/nemotron-3-super-120b-a12b
      - z-ai/glm-5.2
  poolside:
    enabled: true
    base_url: https://inference.poolside.ai/v1
    api_key: ${POOLSIDE_API_KEY}
    timeout_seconds: 1200   # doubled 2026-08-12: pi owns 429 backoff; long reasoning generations need headroom
    # Poolside Platform models use their own namespace, kept disjoint from
    # OpenRouter so direct Poolside requests never consume OpenRouter quota.
    model_prefixes:
      - poolside/
    models:
      - poolside/laguna-xs-2.1
      - poolside/laguna-s-2.1
  openai:
    enabled: true
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}
    timeout_seconds: 1200   # doubled 2026-08-12: pi owns 429 backoff; long reasoning generations need headroom
    # Direct OpenAI access via a service-account key.  OpenAI uses BARE model
    # names (no namespace), so there is no ``model_prefixes`` entry — only the
    # chat/reasoning models explicitly listed below are recognised globally.
    # Send any other OpenAI model (dated snapshots, etc.) via the per-key
    # ``guardian/openai/{model}`` route, which does not require listing.
    # NB: while OpenRouter serves the ``openai/{model}`` SLUG (e.g.
    # openai/gpt-4o), this direct provider answers the BARE name (gpt-4o).
    # Models verified against GET https://api.openai.com/v1/models on 2026-08-01.
    models:
      - gpt-4o
      - gpt-4o-mini
      - gpt-4.1
      - gpt-4.1-mini
      - gpt-4.1-nano
      - gpt-4-turbo
      - gpt-3.5-turbo
      - gpt-5
      - gpt-5-mini
      - gpt-5-nano
      - gpt-5-pro
      - gpt-5-codex
      - gpt-5.1
      - gpt-5.1-codex
      - gpt-5.1-codex-max
      - gpt-5.1-codex-mini
      - gpt-5.2
      - gpt-5.2-codex
      - gpt-5.2-pro
      - gpt-5.3-codex
      - gpt-5.4
      - gpt-5.4-mini
      - gpt-5.4-nano
      - gpt-5.4-pro
      - gpt-5.5
      - gpt-5.5-pro
      - gpt-5.6-luna
      - gpt-5.6-sol
      - gpt-5.6-terra
      - o3
      - o3-mini
      - o4-mini
      - chat-latest
queue:
  max_concurrent: 1
  queue_timeout_seconds: 300  # advisory queue wait budget for clients/status, not an internal 429 drop timer
  history_ttl: 300            # seconds; prune completed-request history more aggressively (was default 900)
services:
  comfyui_url: http://127.0.0.1:8188
timeouts:
  tiers:
    tier_70b:
      min_size_mb: 40000
      timeout_seconds: 3600   # 256K-context 70B+ models need long generation budgets (was 1800)
    tier_32b:
      min_size_mb: 20000
      timeout_seconds: 1200
    tier_13b:
      min_size_mb: 10000
      timeout_seconds: 600
    tier_8b:
      min_size_mb: 5000
      timeout_seconds: 360
    tier_small:
      min_size_mb: 0
      timeout_seconds: 600
  default_timeout: 600
scaler:
  enabled: true
  log_decisions: true
  profiles:
    trivial:
      max_chars: 200
      max_messages: 2
      thinking_budget: 256
      max_tokens: 1024
    simple:
      max_chars: 800
      max_messages: 4
      thinking_budget: 1024
      max_tokens: 4096
    moderate:
      max_chars: 4000
      max_messages: 12
      thinking_budget: 4096
      max_tokens: 8192
    complex:
      max_chars: 15000
      max_messages: 30
      thinking_budget: 8192
      max_tokens: 16384
    deep:
      thinking_budget: -1
      max_tokens: 32768
  queue_pressure:
    moderate_threshold: 2
    heavy_threshold: 4
    moderate_thinking_factor: 0.5
    heavy_thinking_factor: 0.25
    moderate_max_tokens_factor: 0.75
    heavy_max_tokens_factor: 0.5

# === Guardian Capture Subsystem (Phase 0-2) ===
# Privacy-aware, non-blocking capture boundary between Guardian and Keanu Factory.
# Captures eligible request/response data as append-only JSONL for dataset construction.
# Default posture: DISABLED.  Capture failure never blocks inference (fail-open).
# See docs/GUARDIAN_KEANU_CAPTURE_PLAN.json for the full contract.
capture:
  enabled: false                    # Global kill switch — must be true to capture anything
  local_capture: false              # Capture local (llama-server) inference
  cloud_capture: false              # Capture cloud provider responses (requires terms review)
  cloud_allowlist_enabled: true      # Only capture cloud models matching allowlist/prefixes
  allowed_cloud_models: []           # Explicit cloud models permitted for capture
  cloud_model_prefixes:              # Namespace prefixes that permit capture
    - "openai/"                        # e.g. openai/gpt-4o
    - "anthropic/"
    - "google/"
    - "meta-llama/"
    - "deepseek/"
    - "qwen/"
    - "mistralai/"
    - "z-ai/"
    - "minimax/"
    - "poolside/"
    - "moonshotai/"
    - "nvidia/"
  per_client_opt_in: true           # When true, only listed client_refs are captured
  allowed_client_refs: []           # HMAC-SHA-256 refs of opted-in clients
  # Field policies: "strip" = never persist, "capture" = persist with redaction
  system_prompts: strip             # Never persist system prompt content
  reasoning: strip                  # Never persist reasoning/thinking content
  tool_definitions: capture         # Persist tool definitions (structurally sanitized)
  tool_calls: capture               # Persist tool calls (structurally sanitized)
  tool_results: strip               # Never persist tool results
  images: hash_and_metadata         # Replace raw image data with SHA-256 + metadata
  unknown_content_blocks: strip     # Never persist unknown block types
  # Storage and lifecycle
  capture_root: data/capture         # Root directory for capture files
  retention_days: 7                 # Auto-remove files older than N days
  max_capture_bytes: 10737418240    # 10 GB total disk budget for capture files
  max_pending_events: 10000         # Bounded event queue size (drop on overflow)
  max_file_bytes: 268435456         # Rotate active file at 256 MB
  max_file_age_seconds: 3600        # Rotate active file after 1 hour
  file_mode: "0640"                 # owner rw, group r (never world-accessible)
  directory_mode: "0750"            # owner rwx, group rx (never world-accessible)
  policy_version: "1.0.0"           # Capture policy version (recorded on every event)
  # instance_id is generated at first startup; set explicitly to pin a stable identity
  # ── Secret rotation (Decision 1A: multi-secret overlap) ──────────────
  # GUARDIAN_CAPTURE_CLIENT_REF_SECRET: Current HMAC key for client_ref computation.
  #   .env only — never inline in YAML.
  # GUARDIAN_CAPTURE_CLIENT_REF_SECRET_PREVIOUS: Legacy HMAC keys (comma-separated)
  #   for seamless rotation.  Old opt-in client_refs remain valid until migrated.
  # ── Per-record HMAC (Decision 2A) ────────────────────────────────────
  # GUARDIAN_CAPTURE_RECORD_AUTH_SECRET: HMAC key for per-record WAL authentication.
  #   Each JSONL line gets a record_auth field with {alg, key_id, mac}.
  #   Keanu verifies individual record authenticity with a verification-only copy.
  #   .env only — never inline in YAML.
