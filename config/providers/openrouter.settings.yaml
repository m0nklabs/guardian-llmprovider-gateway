# OpenRouter cloud provider.
# Per-model overrides (context_window / model_defaults) live in the `models:`
# block; they were formerly part of config/models.cloud.overrides.yaml.
enabled: true
base_url: https://openrouter.ai/api/v1
api_key: ${OPENROUTER_API_KEY}
timeout_seconds: 1200
# Default service tier for requests that don't pin one (OpenRouter service
# tiers): flex = cheaper, higher latency/lower availability. Operator default
# (2026-10-04): cost first. Precedence: client value > model default > this.
service_tier: flex
model_prefixes:
- anthropic/
- openai/
- google/
- meta-llama/
- deepseek/
- qwen/
- mistralai/
- z-ai/
- minimax/
- poolside/
- moonshotai/
- nvidia/
# OpenRouter applies guardrails on inference only, not on the plain /v1/models
# listing (which returns every model). /models/user restricts discovery to the
# models genuinely reachable through the account's guardrails/privacy filters.
catalog_url: /models/user
models:
  deepseek/deepseek-chat:
    context_window: 1000000
  deepseek/deepseek-v4-flash-0731:
    context_window: 1048576
  # minimax/minimax-m3: brand `minimax/` matches openrouter's model_prefixes
  # (the `minimaxai/` brand is served by nvidia — see nvidia.settings.yaml).
  minimax/minimax-m3:
    max_tokens: 8192
    temperature: 1.0
    top_p: 0.95
  # z-ai/glm-5.2: brand `z-ai/` is declared on both openrouter and nvidia, but
  # nvidia's catalog_allowlist contains no z-ai model, so the free token cannot
  # actually route it there — served via openrouter.
  z-ai/glm-5.2:
    max_tokens: 16384
    seed: 42
    temperature: 1
    top_p: 1
# Reference catalog (docs/OPENROUTER_PARITY.md §2): cross-provider model
# metadata gap filling. This is deliberately NOT the discovery endpoint — the
# public /models list is fetched purely as reference data (architecture,
# pricing, top_provider, supported_parameters, …) for models another provider
# actually serves. It never changes which models Guardian advertises: the
# account-scoped `catalog_url: /models/user` above stays authoritative for
# discovery, routing and allowlists.
reference_catalog:
  sources:
    # Public OpenRouter catalog (~460 models): fills the gaps left by upstreams
    # whose own /v1/models advertises almost nothing (e.g. OpenAI says nothing
    # about tools or reasoning). No API key is needed or sent.
    - name: openrouter
      url: https://openrouter.ai/api/v1/models
      enabled: true
      ttl_seconds: 86400
      send_api_key: false
