# NVIDIA cloud provider (build.nvidia.com free tier).
# Per-model overrides (context_window / model_defaults) live in the `models:`
# block; they were formerly part of config/models.cloud.overrides.yaml.
enabled: true
base_url: https://integrate.api.nvidia.com/v1
api_key: ${NVIDIA_API_KEY}
timeout_seconds: 1200
model_prefixes:
- nvidia/
- deepseek-ai/
- minimaxai/
- z-ai/
# NVIDIA's /v1/models lists every model regardless of what the free token can
# reach (102 total, no free marker). This allowlist restricts discovery +
# routing to the models NVIDIA treats as free ("Free Endpoint" on
# build.nvidia.com, filter nimType:nim_type_preview), plus moonshotai/kimi-k3
# which the API serves even though it is not (yet) marked free on the page.
# Refreshed by scripts/sync_nvidia_free_models.js.
catalog_allowlist:
- deepseek-ai/deepseek-v4-flash-0731
- google/diffusiongemma-26b-a4b-it
- google/gemma-4-31b-it
- meta/llama-3.1-70b-instruct
- meta/llama-3.1-8b-instruct
- meta/llama-3.2-11b-vision-instruct
- meta/llama-3.2-1b-instruct
- meta/llama-3.2-3b-instruct
- meta/llama-3.2-90b-vision-instruct
- meta/llama-3.3-70b-instruct
- meta/llama-guard-4-12b
- meta/muse-glimmer-30b
- minimaxai/minimax-m3
- mistralai/mistral-nemotron
- moonshotai/kimi-k3
- nvidia/ising-calibration-1.5-31b
- nvidia/llama-3.1-nemotron-nano-8b-v1
- nvidia/llama-3.1-nemotron-nano-vl-8b-v1
- nvidia/llama-3.1-nemotron-safety-guard-8b-v3
- nvidia/llama-3.3-nemotron-super-49b-v1
- nvidia/llama-3.3-nemotron-super-49b-v1.5
- nvidia/nemotron-3-embed-1b
- nvidia/nemotron-3-nano-30b-a3b
- nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
- nvidia/nemotron-3-super-120b-a12b
- nvidia/nemotron-3-ultra-550b-a55b
- nvidia/nemotron-3.5-content-safety
- nvidia/nemotron-3.5-lightning-30b-a3b
- nvidia/nemotron-mini-4b-instruct
- nvidia/nemotron-nano-12b-v2-vl
- nvidia/nv-embed-v1
- nvidia/nv-embedcode-7b-v1
- nvidia/nvidia-nemotron-nano-9b-v2
- nvidia/riva-translate-4b-instruct-v1.1
- nvidia/riva-translate-4b-instruct-v2
- openai/gpt-oss-120b
- openai/gpt-oss-20b
- poolside/laguna-xs-2.1
- stepfun-ai/step-3.7-flash
- thinkingmachines/inkling
models:
  # minimaxai/minimax-m3: brand `minimaxai/` matches nvidia's model_prefixes
  # (the `minimax/` brand is served by openrouter — see openrouter.settings.yaml).
  minimaxai/minimax-m3:
    max_tokens: 8192
    temperature: 1.0
    top_p: 0.95
  # moonshotai/kimi-k3: both openrouter and nvidia declare `moonshotai/`, but
  # nvidia's catalog_allowlist explicitly includes moonshotai/kimi-k3, so it is
  # reachable (and free) through nvidia.
  moonshotai/kimi-k3:
    context_window: 1048576
