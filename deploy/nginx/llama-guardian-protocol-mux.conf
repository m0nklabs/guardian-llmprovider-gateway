map $ssl_preread_protocol $guardian_backend {
    "" guardian_http_backend;
    default guardian_https_backend;
}

log_format guardian_stream '$remote_addr [$time_local] $guardian_backend $status '
                           '$bytes_sent $bytes_received $session_time '
                           '$upstream_addr $upstream_connect_time';

access_log /var/log/nginx/guardian-stream.log guardian_stream;

upstream guardian_http_backend {
    server 127.0.0.1:11436;
}

upstream guardian_https_backend {
    server 127.0.0.1:11435;
}

server {
    listen 0.0.0.0:11434;
    proxy_pass $guardian_backend;
    proxy_connect_timeout 5s;
    proxy_timeout 1h;
    ssl_preread on;
}