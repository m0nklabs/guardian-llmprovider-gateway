# Guardian dashboard — LAN reverse proxy.
#
# The dashboard UI is served by the Guardian app on 127.0.0.1:11437
# (app/main.py:448, hardcoded loopback binding since commit 7472d61
# "security: add auth to dashboard :11437, bind to 127.0.0.1 only").
# Do NOT change the app binding — the correct fix is this nginx layer:
# expose the dashboard on the LAN IP 192.168.1.35:11437 and proxy to loopback.
#
# Security: the dashboard admin API (/api/*) requires a Guardian Bearer key,
# but the static shell is public and the app has no rate limiting on auth
# failures (subprocess-per-401 DoS vector behind a proxy). Defense-in-depth:
# this block only accepts connections from the LAN subnet (192.168.1.0/24).
#
# SSE (EventSource) + WebSocket support: buffering is off and the Upgrade
# headers are passed through, matching the loopback-http.conf approach.

server {
    listen 192.168.1.35:11437;
    server_name _;
    client_max_body_size 32m;

    # LAN-only perimeter (defense-in-depth; dashboard admin API is bearer-protected)
    allow 192.168.1.0/24;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:11437;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
