[Service]
UMask=0077
# Template: rendered by scripts/install.sh. The TLS pair lives OUTSIDE the
# repo (never commit private keys); the default directory matches the
# installer's --tls-dir default.
Environment=GUARDIAN_TLS_CERTFILE=@TLS_CERTFILE@
Environment=GUARDIAN_TLS_KEYFILE=@TLS_KEYFILE@
Environment=GUARDIAN_TLS_HOST=127.0.0.1
Environment=GUARDIAN_TLS_PORT=11435
